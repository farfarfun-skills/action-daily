name: Publish Paperclip to Aliyun

on:
  push:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

concurrency:
  group: publish-paperclip
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_REGISTRY: ${{ secrets.ALIYUN_NPM_REGISTRY }}
      NPM_USERNAME: ${{ secrets.ALIYUN_NPM_USERNAME }}
      NPM_PASSWORD: ${{ secrets.ALIYUN_NPM_PASSWORD }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish upstream nightly as latest
        shell: bash
        run: |
          set -euo pipefail
          : "${NPM_REGISTRY:?ALIYUN_NPM_REGISTRY is not set}"
          : "${NPM_USERNAME:?ALIYUN_NPM_USERNAME is not set}"
          : "${NPM_PASSWORD:?ALIYUN_NPM_PASSWORD is not set}"

          auth="$(node -e 'process.stdout.write(Buffer.from(process.env.NPM_USERNAME + ":" + process.env.NPM_PASSWORD).toString("base64"))')"
          registry_key="$(node -e 'const url = new URL(process.env.NPM_REGISTRY); process.stdout.write("//" + url.host + url.pathname.replace(/\/?$/, "/"))')"
          printf 'registry=%s\n%s:_auth=%s\n' "$NPM_REGISTRY" "$registry_key" "$auth" > "$RUNNER_TEMP/paperclip.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/paperclip.npmrc"

          read -r version_date hour <<< "$(TZ=Asia/Shanghai date '+%Y.%-m%d %-H')"
          version="$version_date.$((hour / 6))"

          source_version="$(npm view paperclipai@nightly version --registry=https://registry.npmjs.org)"
          tarball="$(npm pack "paperclipai@$source_version" --registry=https://registry.npmjs.org --pack-destination="$RUNNER_TEMP" --silent)"
          package_dir="$RUNNER_TEMP/paperclip-package"
          mkdir "$package_dir"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$package_dir" --strip-components=1

          mirror_dependency() {
            local name="$1" range="$2" resolved current tarball_path
            resolved="$(npm view "$name@$range" version --json --registry=https://registry.npmjs.org 2>/dev/null | node -e '
              let d = "";
              process.stdin.on("data", (c) => (d += c));
              process.stdin.on("end", () => {
                try {
                  const v = JSON.parse(d);
                  const arr = Array.isArray(v) ? v : [v];
                  if (arr.length && typeof arr[arr.length - 1] === "string") {
                    console.log(arr[arr.length - 1]);
                  }
                } catch {}
              });
            ' || true)"
            if [[ -z "$resolved" ]]; then
              echo "Skipping $name@$range: no matching version on npmjs."
              return
            fi
            current="$(npm view "$name@$resolved" version --registry="$NPM_REGISTRY" 2>/dev/null || true)"
            if [[ "$current" == "$resolved" ]]; then
              echo "$name@$resolved is already on Aliyun."
              return
            fi
            echo "Publishing $name@$resolved to Aliyun..."
            tarball_path="$(npm pack "$name@$resolved" --registry=https://registry.npmjs.org --pack-destination="$RUNNER_TEMP" --silent)"
            npm publish "$RUNNER_TEMP/$tarball_path" --registry="$NPM_REGISTRY" --tag=nightly
            [[ "$(npm view "$name@$resolved" version --registry="$NPM_REGISTRY")" == "$resolved" ]]
          }

          # paperclipai pins scoped dependencies (some exact, some prerelease
          # ranges like @embedded-postgres/<platform>) that Aliyun may not have
          # synced yet. Mirror each one so `npm install paperclipai` resolves
          # them from Aliyun instead of pnpm silently dropping unresolved
          # optional deps.
          while IFS=$'\t' read -r dep_name dep_range; do
            [[ -z "$dep_name" ]] && continue
            mirror_dependency "$dep_name" "$dep_range"
          done < <(node -e "
            const pkg = require('$package_dir/package.json');
            const deps = { ...pkg.dependencies, ...pkg.optionalDependencies };
            for (const [name, range] of Object.entries(deps)) {
              if (name.startsWith('@')) console.log(name + '\t' + range);
            }
          ")

          current="$(npm view paperclipai@latest version --registry="$NPM_REGISTRY" 2>/dev/null || true)"
          if [[ "$current" == "$version" ]]; then
            echo "paperclipai@$version is already latest."
            exit 0
          fi

          npm --prefix "$package_dir" pkg set "version=$version"
          npm publish "$package_dir" --registry="$NPM_REGISTRY" --tag=latest
          [[ "$(npm view paperclipai@latest version --registry="$NPM_REGISTRY")" == "$version" ]]
