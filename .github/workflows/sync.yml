name: Daily sync

on:
  push:
  schedule:
    - cron: "7 * * * *"     # hourly incremental, off the :00 mark to avoid GitHub's scheduling congestion
    - cron: "42 20 * * *"   # daily full sync (04:42 Asia/Shanghai) -- re-verifies every repo against Gitee and self-heals any state drift left by an incremental run
  workflow_dispatch:
    inputs:
      full:
        description: 'Force a full sync (ignore the state file for skip decisions)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync matching forks with their upstream repositories
        id: repos
        uses: farfarfun-action/sync-forks@v1
        with:
          github-token: ${{ secrets.ACTION_GITHUB_TOKEN }}

      - name: Decide incremental vs full sync
        id: mode
        run: |
          full="${{ github.event.schedule == '42 20 * * *' || inputs.full == true }}"
          if [[ "$full" == "true" ]]; then
            echo "incremental=false" >> "$GITHUB_OUTPUT"
            echo "workers=2" >> "$GITHUB_OUTPUT"
          else
            echo "incremental=true" >> "$GITHUB_OUTPUT"
            echo "workers=8" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror all Github repositories to Gitee
        if: always() && steps.repos.outputs.all-repo-names != ''
        uses: farfarfun-action/mirror-repo@v1
        with:
          src: github/${{ github.repository_owner }}
          dst: gitee/farfarfun-skills
          dst_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          repo-names: ${{ steps.repos.outputs.all-repo-names }}
          state-file: .mirror-state/gitee.json
          incremental: ${{ steps.mode.outputs.incremental }}
          workers: ${{ steps.mode.outputs.workers }}

      # Committed to this repo so it survives across runs (runners are
      # ephemeral); "[skip ci]" stops this from re-triggering the `on: push`
      # trigger above.
      - name: Persist mirror state
        if: always()
        run: |
          [[ -f .mirror-state/gitee.json ]] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .mirror-state/gitee.json
          git diff --cached --quiet || git commit -m 'chore: update Gitee mirror state [skip ci]'

          # github.sha (and thus this checkout) is resolved at trigger time,
          # not run-start time, so an overlapping run can leave main ahead of
          # what we checked out even after the concurrency group serializes
          # execution. The state file is regenerated fresh each run rather
          # than diff-applied, so preferring "ours" on conflict is safe --
          # any staleness self-heals on the next full sync.
          for i in 1 2 3 4 5; do
            git push && break
            [[ $i -eq 5 ]] && exit 1
            git fetch origin main
            git rebase -X ours origin/main
          done
