name: Daily sync

on:
  push:
  schedule:
    - cron: "7 * * * *" # Every hour, off the :00 mark to avoid GitHub's scheduling congestion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync matching forks with their upstream repositories
        id: repos
        uses: farfarfun-action/sync-forks@v1
        with:
          github-token: ${{ secrets.ACTION_GITHUB_TOKEN }}

      - name: Mirror all Github repositories to Gitee
        if: always() && steps.repos.outputs.all-repo-names != ''
        uses: farfarfun-action/mirror-to-gitee@v1
        with:
          github-org: ${{ github.repository_owner }}
          gitee-org: farfarfun-skills
          gitee-key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          gitee-token: ${{ secrets.GITEE_TOKEN }}
          repo-names: ${{ steps.repos.outputs.all-repo-names }}
