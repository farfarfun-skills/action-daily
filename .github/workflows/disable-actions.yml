name: Disable org actions

on:
  schedule:
    - cron: "23 21 * * *"   # 05:23 Asia/Shanghai -- after the daily full sync, so newly created/forked repos get disabled too
  workflow_dispatch:
    inputs:
      scope:
        description: 'repo = switch Actions off for the whole repository; workflows = disable each workflow individually'
        type: choice
        options:
          - repo
          - workflows
        default: repo
      keep:
        description: 'Extra comma-separated repo names to leave enabled (this repo is always kept)'
        type: string
        default: ''
      dry-run:
        description: 'Only report what would be disabled'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: disable-org-actions
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    env:
      # Needs org-wide repo access plus, for scope=repo, "Administration:
      # Read and write" and, for scope=workflows, "Actions: Read and write".
      GH_TOKEN: ${{ secrets.ACTION_GITHUB_TOKEN }}
      ORG: ${{ github.repository_owner }}
      SCOPE: ${{ inputs.scope || 'repo' }}
      KEEP: ${{ inputs.keep }}
      DRY_RUN: ${{ inputs.dry-run || false }}
    steps:
      - name: Disable Actions on every repository except this one
        run: |
          set -uo pipefail

          # github.event.repository is absent on some trigger payloads, so
          # derive our own name from GITHUB_REPOSITORY instead.
          self="${GITHUB_REPOSITORY#*/}"
          keep=$'\n'"$self"$'\n'
          IFS=',' read -ra extra <<< "$KEEP"
          for name in "${extra[@]}"; do
            name="${name//[[:space:]]/}"
            [[ -n "$name" ]] && keep+="$name"$'\n'
          done

          # Archived repos reject writes, and their Actions are already inert.
          mapfile -t repos < <(gh api --paginate \
            "/orgs/$ORG/repos?per_page=100&type=all" \
            --jq '.[] | select(.archived | not) | .name' | sort)
          if [[ ${#repos[@]} -eq 0 ]]; then
            echo "::error::could not list repositories for org $ORG"
            exit 1
          fi

          disabled=0 already=0 kept=0 failed=0
          summary=$(mktemp)

          # Both paths read the current state first and only write to repos
          # that are still enabled, so re-runs are no-ops.
          disable_repo() {
            local repo="$1" state
            state=$(gh api "/repos/$ORG/$repo/actions/permissions" --jq '.enabled' 2>/dev/null) || state=''
            if [[ "$state" == "false" ]]; then
              echo "  already disabled"
              already=$(( already + 1 ))
              return 0
            fi
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  would disable Actions"
              disabled=$(( disabled + 1 ))
              return 0
            fi
            # `allowed_actions` must be omitted when enabled=false.
            if gh api -X PUT "/repos/$ORG/$repo/actions/permissions" -F enabled=false; then
              echo "  disabled Actions"
              disabled=$(( disabled + 1 ))
            else
              echo "::warning::failed to disable Actions for $repo"
              echo "- \`$repo\`: repository-level disable failed" >> "$summary"
              failed=$(( failed + 1 ))
            fi
          }

          disable_workflows() {
            local repo="$1" line id path
            local -a active
            mapfile -t active < <(gh api --paginate \
              "/repos/$ORG/$repo/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(.state == "active") | "\(.id)\t\(.path)"' 2>/dev/null)
            if [[ ${#active[@]} -eq 0 ]]; then
              echo "  nothing active"
              already=$(( already + 1 ))
              return 0
            fi
            for line in "${active[@]}"; do
              id="${line%%$'\t'*}"
              path="${line#*$'\t'}"
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "  would disable $path"
                disabled=$(( disabled + 1 ))
                continue
              fi
              if gh api -X PUT "/repos/$ORG/$repo/actions/workflows/$id/disable"; then
                echo "  disabled $path"
                disabled=$(( disabled + 1 ))
              else
                echo "::warning::failed to disable $repo/$path"
                echo "- \`$repo\`: could not disable \`$path\`" >> "$summary"
                failed=$(( failed + 1 ))
              fi
            done
          }

          for repo in "${repos[@]}"; do
            if [[ "$keep" == *$'\n'"$repo"$'\n'* ]]; then
              echo "$repo: kept"
              kept=$(( kept + 1 ))
              continue
            fi
            echo "$repo:"
            if [[ "$SCOPE" == "workflows" ]]; then
              disable_workflows "$repo"
            else
              disable_repo "$repo"
            fi
          done

          {
            echo "## Disable org actions"
            echo
            echo "Org \`$ORG\`, scope \`$SCOPE\`$([[ "$DRY_RUN" == "true" ]] && echo ' (dry run)')."
            echo
            echo "| repos scanned | disabled | already off | kept | failed |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| ${#repos[@]} | $disabled | $already | $kept | $failed |"
            if [[ -s "$summary" ]]; then
              echo
              echo "### Failures"
              cat "$summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [[ $failed -eq 0 ]]
