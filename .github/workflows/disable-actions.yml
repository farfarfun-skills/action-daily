name: Disable org workflows

on:
  schedule:
    - cron: "23 21 * * *"   # 05:23 Asia/Shanghai -- after the daily full sync, so workflows pulled in by a fresh fork get disabled too
  workflow_dispatch:
    inputs:
      keep:
        description: 'Extra comma-separated repo names to leave untouched (this repo is always kept)'
        type: string
        default: ''
      dry-run:
        description: 'Only report what would be disabled'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: disable-org-workflows
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    env:
      # Needs org-wide repo access plus "Actions: Read and write".
      GH_TOKEN: ${{ secrets.ACTION_GITHUB_TOKEN }}
      ORG: ${{ github.repository_owner }}
      KEEP: ${{ inputs.keep }}
      DRY_RUN: ${{ inputs.dry-run || false }}
    steps:
      - name: Disable every workflow outside this repository
        run: |
          set -uo pipefail

          # github.event.repository is absent on some trigger payloads, so
          # derive our own name from GITHUB_REPOSITORY instead.
          self="${GITHUB_REPOSITORY#*/}"
          keep=$'\n'"$self"$'\n'
          IFS=',' read -ra extra <<< "$KEEP"
          for name in "${extra[@]}"; do
            name="${name//[[:space:]]/}"
            [[ -n "$name" ]] && keep+="$name"$'\n'
          done

          # Archived repos reject writes, and their workflows never run.
          mapfile -t repos < <(gh api --paginate \
            "/orgs/$ORG/repos?per_page=100&type=all" \
            --jq '.[] | select(.archived | not) | .name' | sort)
          if [[ ${#repos[@]} -eq 0 ]]; then
            echo "::error::could not list repositories for org $ORG"
            exit 1
          fi

          disabled=0 already=0 kept=0 failed=0
          summary=$(mktemp)

          for repo in "${repos[@]}"; do
            if [[ "$keep" == *$'\n'"$repo"$'\n'* ]]; then
              echo "$repo: kept"
              kept=$(( kept + 1 ))
              continue
            fi
            echo "$repo:"

            # Only "active" workflows need a write -- anything already in
            # disabled_manually / disabled_inactivity / disabled_fork is left
            # alone, which makes re-runs no-ops.
            mapfile -t active < <(gh api --paginate \
              "/repos/$ORG/$repo/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(.state == "active") | "\(.id)\t\(.path)"' 2>/dev/null)
            if [[ ${#active[@]} -eq 0 ]]; then
              echo "  nothing active"
              already=$(( already + 1 ))
              continue
            fi

            for line in "${active[@]}"; do
              id="${line%%$'\t'*}"
              path="${line#*$'\t'}"
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "  would disable $path"
                disabled=$(( disabled + 1 ))
                continue
              fi
              if gh api -X PUT "/repos/$ORG/$repo/actions/workflows/$id/disable"; then
                echo "  disabled $path"
                disabled=$(( disabled + 1 ))
              else
                echo "::warning::failed to disable $repo/$path"
                echo "- \`$repo\`: could not disable \`$path\`" >> "$summary"
                failed=$(( failed + 1 ))
              fi
            done
          done

          {
            echo "## Disable org workflows"
            echo
            echo "Org \`$ORG\`$([[ "$DRY_RUN" == "true" ]] && echo ' (dry run)')."
            echo
            echo "| repos scanned | workflows disabled | repos already clean | repos kept | failures |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| ${#repos[@]} | $disabled | $already | $kept | $failed |"
            if [[ -s "$summary" ]]; then
              echo
              echo "### Failures"
              cat "$summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [[ $failed -eq 0 ]]
